<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#991b1b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OST Tracker">
  <meta name="application-name" content="OST Tracker">
  <meta name="description" content="Outstanding Backlog & Vendor ETA">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>OST Tracker | Outstanding Backlog & Vendor ETA</title>
  <meta name="ost-pwa-version" content="webapk-flat-fix-v6-phone-only-direct">
  <style>
    :root{--primary:#991b1b;--primary2:#dc2626;--navy:#071326;--surface:#fff;--ink:#172033;--muted:#64748b}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--navy);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:fixed;inset:0;background:var(--navy)}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;background:radial-gradient(circle at top,#17375f 0%,#071326 55%,#040b16 100%);transition:.25s}
    .loading.hide{opacity:0;visibility:hidden;pointer-events:none}.brand{width:78px;height:78px;border-radius:22px;background:#fff url('/icon-192.png') center/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.28)}
    .loading strong{font-size:18px}.loading small{font-size:12px;color:#b9c8d9}.spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .72s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .app-actions{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:8;display:flex;gap:8px;align-items:center}.app-btn{appearance:none;border:0;border-radius:12px;padding:11px 14px;text-decoration:none;font:800 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.22);cursor:pointer}.install{display:inline-flex;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.open{display:none;background:#111827;color:#fff}
    .modal-bg{display:none;position:fixed;inset:0;z-index:30;background:rgba(2,6,23,.72);align-items:center;justify-content:center;padding:20px}.modal-bg.show{display:flex}.modal{width:min(440px,100%);background:#fff;color:#172033;border-radius:22px;padding:22px;box-shadow:0 28px 80px rgba(0,0,0,.35)}.modal h2{font-size:20px;margin:0 0 9px}.modal p{font-size:13px;line-height:1.55;color:#64748b;margin:0 0 12px}.steps{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:13px;font-size:13px;line-height:1.7;margin:12px 0}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.modal-actions button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.close{background:#e2e8f0;color:#334155}.retry{background:#991b1b;color:#fff}
    .installed-badge{display:none;background:#166534;color:#fff}.installed-badge.show{display:inline-flex}.offline-card{display:none;position:fixed;inset:0;z-index:7;align-items:center;justify-content:center;padding:24px;background:var(--navy);color:#fff;text-align:center}.offline-card.show{display:flex}.offline-card>div{max-width:430px}.offline-card h1{font-size:23px;margin:0 0 10px}.offline-card p{font-size:13px;color:#b9c8d9;line-height:1.6;margin:0 0 18px}
    @media(max-width:640px){.app-actions{right:10px;bottom:calc(10px + env(safe-area-inset-bottom))}.app-btn{min-height:44px;padding:12px 15px}.brand{width:70px;height:70px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading" id="loading"><div class="brand"></div><strong>OST Tracker</strong><div class="spinner"></div><small>Membuka Outstanding Backlog & Vendor ETA...</small></div>
    <iframe id="appFrame" title="OST Tracker" src="https://script.google.com/a/macros/ppa.co.id/s/AKfycbwOBh2oIWsOhqLYvOIRpE52h3hkaBQ_Q0HIDTUC0JcKPAmgY7iWJhyqRKQ4kuCwOIRblA/exec" allow="camera; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <div class="offline-card" id="offlineCard"><div><h1>Koneksi tidak tersedia</h1><p>Shell aplikasi tersedia, tetapi data OST Tracker membutuhkan koneksi ke Google Apps Script dan Google Sheets.</p><button class="app-btn install" onclick="location.reload()">Coba Lagi</button></div></div>

  <div class="app-actions">
    <button id="installBtn" class="app-btn install" type="button">⬇ Install App</button>
    <span id="installedBadge" class="app-btn installed-badge">✓ Terpasang</span>
    <a id="openDirectBtn" class="app-btn open" href="https://script.google.com/a/macros/ppa.co.id/s/AKfycbwOBh2oIWsOhqLYvOIRpE52h3hkaBQ_Q0HIDTUC0JcKPAmgY7iWJhyqRKQ4kuCwOIRblA/exec" target="_blank" rel="noopener">Buka Langsung</a>
  </div>

  <div id="installHelp" class="modal-bg" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="helpTitle">Install OST Tracker</h2>
      <p id="helpText">Browser belum menyediakan popup instalasi otomatis.</p>
      <div class="steps" id="helpSteps"></div>
      <div class="modal-actions"><button class="close" id="closeHelp">Tutup</button><button class="retry" id="retryInstall">Coba Lagi</button></div>
    </div>
  </div>

  <script>
    const frame=document.getElementById('appFrame'),loading=document.getElementById('loading'),offlineCard=document.getElementById('offlineCard');
    const installBtn=document.getElementById('installBtn'),installedBadge=document.getElementById('installedBadge');
    const installHelp=document.getElementById('installHelp'),helpTitle=document.getElementById('helpTitle'),helpText=document.getElementById('helpText'),helpSteps=document.getElementById('helpSteps');
    let deferredPrompt=null,loaded=false;
    const INSTALL_FLAG='ost_tracker_pwa_installed_v1';

    function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true}
    function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
    function isAndroid(){return /android/i.test(navigator.userAgent)}
    function isPhoneDevice(){
      // Buka Langsung hanya untuk HP. Tablet/iPad dan desktop sengaja dikecualikan.
      try{
        if(navigator.userAgentData && typeof navigator.userAgentData.mobile==='boolean'){
          return navigator.userAgentData.mobile===true;
        }
      }catch(e){}
      const ua=String(navigator.userAgent||'');
      if(/iPad|Tablet|Nexus 7|Nexus 9|Nexus 10|SM-T|Tab/i.test(ua))return false;
      if(/iPhone|iPod|Windows Phone|IEMobile|Opera Mini/i.test(ua))return true;
      // Android phone umumnya memiliki token "Mobile"; Android tablet umumnya tidak.
      if(/Android/i.test(ua))return /Mobile/i.test(ua);
      if(/Mobile/i.test(ua))return true;
      // Fallback untuk browser yang menyamarkan UA: batasi ke ukuran fisik kelas HP.
      const shortSide=Math.min(Number(screen.width)||9999,Number(screen.height)||9999);
      return navigator.maxTouchPoints>1 && shortSide<=600;
    }
    const openDirectBtn=document.getElementById('openDirectBtn');
    if(openDirectBtn) openDirectBtn.style.display=isPhoneDevice()?'inline-flex':'none';
    function getInstalledFlag(){try{return localStorage.getItem(INSTALL_FLAG)==='1'}catch(e){return false}}
    function setInstalledFlag(value){try{value?localStorage.setItem(INSTALL_FLAG,'1'):localStorage.removeItem(INSTALL_FLAG)}catch(e){}}
    function isInstalled(){return isStandalone() || getInstalledFlag()}
    function updateInstallUi(){
      const installed=isInstalled();
      installBtn.style.display=installed?'none':'inline-flex';
      // Permintaan user: setelah terpasang, anjuran install hilang total.
      installedBadge.classList.remove('show');
      if(installed) installHelp.classList.remove('show');
    }
    if(isStandalone()) setInstalledFlag(true);
    updateInstallUi();

    function hideLoading(){if(loaded)return;loaded=true;setTimeout(()=>loading.classList.add('hide'),250)}
    frame.addEventListener('load',hideLoading);setTimeout(hideLoading,12000);
    function refreshOnlineState(){offlineCard.classList.toggle('show',!navigator.onLine)}window.addEventListener('online',refreshOnlineState);window.addEventListener('offline',refreshOnlineState);refreshOnlineState();

    window.addEventListener('beforeinstallprompt',e=>{
      e.preventDefault();
      deferredPrompt=e;
      // Jika browser menawarkan install lagi, berarti app tidak sedang terpasang.
      // Hapus marker lama (misalnya setelah user uninstall).
      if(!isStandalone()) setInstalledFlag(false);
      updateInstallUi();
    });
    window.addEventListener('appinstalled',()=>{
      deferredPrompt=null;
      setInstalledFlag(true);
      updateInstallUi();
    });

    // Sinkronkan UI ketika berpindah dari browser ke mode aplikasi / kembali fokus.
    try{window.matchMedia('(display-mode: standalone)').addEventListener('change',()=>{if(isStandalone())setInstalledFlag(true);updateInstallUi()})}catch(e){}
    window.addEventListener('pageshow',updateInstallUi);
    window.addEventListener('focus',updateInstallUi);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateInstallUi()});

    function showHelp(){
      if(isIOS()){
        helpTitle.textContent='Install di iPhone / iPad';
        helpText.textContent='iOS tidak menggunakan popup Install App dari halaman ini.';
        helpSteps.innerHTML='<b>Safari:</b><br>1. Tekan tombol <b>Share / Bagikan</b>.<br>2. Pilih <b>Add to Home Screen / Tambahkan ke Layar Utama</b>.<br>3. Tekan <b>Add / Tambah</b>.';
      }else if(isAndroid()){
        helpTitle.textContent='Install di Android';
        helpText.textContent='Jika popup otomatis belum muncul, gunakan menu browser.';
        helpSteps.innerHTML='<b>Google Chrome:</b><br>1. Tekan menu <b>⋮</b> kanan atas.<br>2. Pilih <b>Install app</b> atau <b>Add to Home screen</b>.<br>3. Konfirmasi <b>Install</b>.';
      }else{
        helpTitle.textContent='Install OST Tracker';
        helpText.textContent='Browser ini belum memberikan prompt instalasi otomatis.';
        helpSteps.innerHTML='Gunakan menu browser dan cari <b>Install OST Tracker</b>, <b>Install app</b>, atau <b>Add to Home screen</b>. Chrome/Edge desktop biasanya juga menampilkan ikon install di address bar.';
      }
      installHelp.classList.add('show');
    }

    async function requestInstall(){
      if(isInstalled()){updateInstallUi();return}
      if(deferredPrompt){
        const promptEvent=deferredPrompt;
        deferredPrompt=null;
        promptEvent.prompt();
        const choice=await promptEvent.userChoice.catch(()=>null);
        if(choice&&choice.outcome==='accepted'){
          // appinstalled akan menjadi sumber status final dan menyembunyikan CTA.
          // Jangan tampilkan fallback help setelah user menerima prompt native.
          return;
        }
      }
      showHelp();
    }
    installBtn.addEventListener('click',requestInstall);document.getElementById('retryInstall').addEventListener('click',()=>{installHelp.classList.remove('show');setTimeout(requestInstall,100)});document.getElementById('closeHelp').addEventListener('click',()=>installHelp.classList.remove('show'));installHelp.addEventListener('click',e=>{if(e.target===installHelp)installHelp.classList.remove('show')});

    if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});reg.update().catch(()=>{})}catch(err){console.warn('Service worker:',err)}})}
  </script>
</body>
</html>
