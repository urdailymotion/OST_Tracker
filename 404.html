<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#991b1b" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OST Tracker" />
  <meta name="application-name" content="OST Tracker" />
  <meta name="description" content="Outstanding Backlog & Vendor ETA" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <title>OST Tracker | Outstanding Backlog & Vendor ETA</title>
  <style>
    :root{--primary:#991b1b;--primary2:#dc2626;--navy:#071326;--surface:#fff;--ink:#172033;--muted:#64748b}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--navy);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:fixed;inset:0;background:var(--navy)}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;background:radial-gradient(circle at top,#17375f 0%,#071326 55%,#040b16 100%);transition:opacity .25s ease,visibility .25s ease}
    .loading.hide{opacity:0;visibility:hidden;pointer-events:none}
    .brand{width:78px;height:78px;border-radius:22px;background:#fff url('./icons/icon-192.png') center/cover no-repeat;box-shadow:0 16px 40px rgba(0,0,0,.28)}
    .loading strong{font-size:18px}.loading small{font-size:12px;color:#b9c8d9}
    .spinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .72s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .app-actions{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:8;display:flex;gap:8px;align-items:center}
    .app-btn{appearance:none;border:0;border-radius:12px;padding:10px 13px;text-decoration:none;font:700 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.22);cursor:pointer}
    .install{display:none;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .open{background:#111827;color:#fff}
    .offline-card{display:none;position:fixed;inset:0;z-index:7;align-items:center;justify-content:center;padding:24px;background:var(--navy);color:#fff;text-align:center}
    .offline-card.show{display:flex}
    .offline-card>div{max-width:430px}.offline-card h1{font-size:23px;margin:0 0 10px}.offline-card p{font-size:13px;color:#b9c8d9;line-height:1.6;margin:0 0 18px}
    @media(max-width:640px){.open{display:none}.app-actions{right:10px;bottom:calc(10px + env(safe-area-inset-bottom))}.app-btn{min-height:42px;padding:11px 14px}.brand{width:70px;height:70px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading" id="loading">
      <div class="brand" aria-hidden="true"></div>
      <strong>OST Tracker</strong>
      <div class="spinner" aria-hidden="true"></div>
      <small>Membuka Outstanding Backlog & Vendor ETA...</small>
    </div>

    <iframe
      id="appFrame"
      title="OST Tracker - Outstanding Backlog Vendor ETA"
      src="https://script.google.com/a/macros/ppa.co.id/s/AKfycbwOBh2oIWsOhqLYvOIRpE52h3hkaBQ_Q0HIDTUC0JcKPAmgY7iWJhyqRKQ4kuCwOIRblA/exec"
      allow="camera; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <div class="offline-card" id="offlineCard">
    <div>
      <h1>Koneksi tidak tersedia</h1>
      <p>Shell aplikasi berhasil dibuka, tetapi data OST Tracker tetap memerlukan koneksi ke Google Apps Script dan Google Sheets.</p>
      <button class="app-btn install" style="display:inline-block" onclick="location.reload()">Coba Lagi</button>
    </div>
  </div>

  <div class="app-actions">
    <button id="installBtn" class="app-btn install" type="button">Install App</button>
    <a class="app-btn open" href="https://script.google.com/a/macros/ppa.co.id/s/AKfycbwOBh2oIWsOhqLYvOIRpE52h3hkaBQ_Q0HIDTUC0JcKPAmgY7iWJhyqRKQ4kuCwOIRblA/exec" target="_blank" rel="noopener">Buka Langsung</a>
  </div>

  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    const offlineCard = document.getElementById('offlineCard');
    const installBtn = document.getElementById('installBtn');
    let deferredPrompt = null;
    let loaded = false;

    function hideLoading(){
      if (loaded) return;
      loaded = true;
      setTimeout(() => loading.classList.add('hide'), 250);
    }

    frame.addEventListener('load', hideLoading);
    setTimeout(hideLoading, 12000);

    function refreshOnlineState(){
      offlineCard.classList.toggle('show', !navigator.onLine);
    }
    window.addEventListener('online', refreshOnlineState);
    window.addEventListener('offline', refreshOnlineState);
    refreshOnlineState();

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = 'inline-flex';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker:', err));
      });
    }
  </script>
</body>
</html>
