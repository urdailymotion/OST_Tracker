<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#991b1b" />
  <title>Outstanding Backlog | Vendor ETA</title>
  <style>
    html,body{height:100%;margin:0;background:#071326;font-family:Arial,Helvetica,sans-serif}
    .shell{position:fixed;inset:0;background:#071326}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;background:#071326;z-index:2}
    .spinner{width:34px;height:34px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fallback{position:fixed;right:14px;bottom:14px;z-index:3}
    .fallback a{display:inline-block;padding:10px 14px;border-radius:10px;background:#991b1b;color:#fff;text-decoration:none;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22)}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Membuka Outstanding Backlog...</div>
    </div>
    <iframe
      id="appFrame"
      title="Outstanding Backlog Vendor ETA"
      src="https://script.google.com/a/macros/ppa.co.id/s/AKfycbwOBh2oIWsOhqLYvOIRpE52h3hkaBQ_Q0HIDTUC0JcKPAmgY7iWJhyqRKQ4kuCwOIRblA/exec"
      allow="camera; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>
  <div class="fallback">
    <a href="https://script.google.com/a/macros/ppa.co.id/s/AKfycbwOBh2oIWsOhqLYvOIRpE52h3hkaBQ_Q0HIDTUC0JcKPAmgY7iWJhyqRKQ4kuCwOIRblA/exec" target="_blank" rel="noopener">Buka langsung</a>
  </div>
  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => {
      setTimeout(() => { loading.style.display = 'none'; }, 350);
    });
  </script>
</body>
</html>
